<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-std.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <div class="logo-group">
          <a href="./">
            <img class="logo" src="/img/logo.png" alt="판다마켓" />
          </a>
          <a class="logo-text" href="./"> 판다마켓 </a>
        </div>
        <button
          class="login-btn"
          type="button"
          onclick="location.href = './login'"
        >
          로그인
        </button>
      </div>
    </header>
    <main class="main">
      <section class="hero-section">
        <div class="hero-box">
          <div class="hero-text-group">
            <h1 class="hero-text">일상의 모든 물건을<br />거래해 보세요</h1>
            <button
              class="hero-btn"
              type="button"
              onclick="location.href = './items'"
            >
              구경하러 가기
            </button>
          </div>

          <img
            class="img-hero"
            src="img/hero.svg"
            alt="판다마켓 메인 일러스트"
          />
        </div>
      </section>
      <section class="hot-section">
        <div class="hot-box">
          <img class="img-hot" src="img/hot.svg" alt="HoT 섹션 일러스트" />
          <div class="hot-text-group">
            <h1 class="hot-text-1">Hot item</h1>
            <div class="hot-text-bottom">
              <h1 class="hot-text-2">인기 상품을<br />확인해 보세요</h1>
              <h1 class="hot-text-3">
                가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
              </h1>
            </div>
          </div>
        </div>
      </section>
      <section class="search-section">
        <div class="search-box">
          <div class="search-text-group">
            <h1 class="search-text-1">Search</h1>
            <div class="search-text-bottom">
              <h1 class="search-text-2">
                구매를 원하는<br />상품을 검색하세요
              </h1>
              <h1 class="search-text-3">
                구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
              </h1>
            </div>
          </div>
          <img
            class="img-search"
            src="img/search.svg"
            alt="Search 섹션 일러스트"
          />
        </div>
      </section>
      <section class="register-section">
        <div class="register-box">
          <img
            class="register-hot"
            src="img/register.svg"
            alt="Register 섹션 일러스트"
          />
          <div class="register-text-group">
            <h1 class="register-text-1">Register</h1>
            <div class="register-text-bottom">
              <h1 class="register-text-2">
                판매를 원하는<br />상품을 등록하세요
              </h1>
              <h1 class="register-text-3">
                어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
              </h1>
            </div>
          </div>
        </div>
      </section>
      <section class="bottom-section">
        <div class="bottom-box">
          <div class="bottom-text-group">
            <h1 class="bottom-text">믿을 수 있는<br />판다마켓 중고 거래</h1>
          </div>
          <img
            class="img-bottom"
            src="img/bottom.svg"
            alt="판다마켓 메인 일러스트"
          />
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-text">©codeit - 2024</div>
        <div class="footer-links">
          <a class="footer-link" href="./privacy">Privacy Policy</a>
          <a class="footer-link" href="./faq">FAQ</a>
        </div>
        <div class="sns-links">
          <a
            href="https://www.facebook.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="img/ic-facebook.svg" alt="Facebook" />
          </a>
          <a
            href="https://www.twitter.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="img/ic-twitter.svg" alt="Twitter" />
          </a>
          <a
            href="https://www.youtube.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="img/ic-youtube.svg" alt="youtube" />
          </a>
          <a
            href="https://www.instagram.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="img/ic-instagram.svg" alt="Instagram" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
